services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: meridian
      DB_USER: meridian
      DB_PASSWORD: meridian
    depends_on:
      db:
        condition: service_healthy

  airflow-init:
    build: .
    entrypoint: /bin/sh
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Meridian \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    environment: &airflow-environment
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://meridian:meridian@db/meridian
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DB_HOST: db
      DB_NAME: meridian
      DB_USER: meridian
      DB_PASSWORD: meridian
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/app/src
      - airflow_logs:/opt/airflow/logs
    depends_on:
      db:
        condition: service_healthy

  airflow-api-server:
    build: .
    entrypoint: airflow
    command: api-server
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/app/src
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build: .
    entrypoint: airflow
    command: scheduler
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/app/src
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    build: .
    entrypoint: airflow
    command: dag-processor
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/app/src
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs: