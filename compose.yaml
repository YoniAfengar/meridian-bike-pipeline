name: "${COMPOSE_PROJECT_NAME:-meridian-bike-pipeline}"

x-airflow-common: &airflow-common
  build: .
  entrypoint: airflow
  environment:
    AIRFLOW_HOME: /opt/airflow
    PYTHONPATH: /app
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://meridian:meridian@db/meridian
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "64"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "16"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "32"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: meridian-local-development-jwt-secret
    AIRFLOW__API__SECRET_KEY: meridian-local-development-api-secret
    DB_HOST: db
    DB_NAME: meridian
    DB_USER: meridian
    DB_PASSWORD: meridian
    COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-meridian-bike-pipeline}"
    MERIDIAN_PROJECT_DIR: "${PWD}"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/plugins:/opt/airflow/plugins:ro
    - ./src:/app/src:ro
    - airflow_logs:/opt/airflow/logs
    - "${PWD}:${PWD}:ro"
    - /var/run/docker.sock:/var/run/docker.sock

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: meridian
      DB_USER: meridian
      DB_PASSWORD: meridian
    depends_on:
      db:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    command: ["db", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs: